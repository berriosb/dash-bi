name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm 9.12
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # devDependencies are required for lint, typecheck, test, and the
      # 'husky' prepare hook. Do NOT set NODE_ENV=production here or
      # pnpm will skip them.
      - name: Install dependencies (dev + prod)
        run: pnpm install --frozen-lockfile

      # TODO(sprint-6): tighten this to --max-warnings 0 once the 59
      # pre-existing warnings are cleaned up. Tracked at
      # https://github.com/berriosb/dash-bi/issues/<TBD>.
      #
      # For now we allow up to 100 so the gate doesn't fail on
      # pre-existing tech debt while still catching new errors and
      # flagging significant regressions (>100 warnings).
      - name: 'Lint (errors gate; warnings baseline: 100)'
        run: pnpm lint --max-warnings 100
        env:
          NODE_ENV: production
          BETTER_AUTH_SECRET: ci_placeholder_secret_at_least_32_characters_long_xxxxx
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://dashbi:changeme@localhost:5432/dashbi
          DATABASE_READONLY_URL: postgresql://dashbi_readonly:changeme@localhost:5432/dashbi
          REDIS_URL: redis://localhost:6379
          LLM_KEY_ENCRYPTION_KEY: ci_placeholder_encryption_key_at_least_32_chars_xxxxxxx
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_ENV: production
          BETTER_AUTH_SECRET: ci_placeholder_secret_at_least_32_characters_long_xxxxx
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://dashbi:changeme@localhost:5432/dashbi
          DATABASE_READONLY_URL: postgresql://dashbi_readonly:changeme@localhost:5432/dashbi
          REDIS_URL: redis://localhost:6379
          LLM_KEY_ENCRYPTION_KEY: ci_placeholder_encryption_key_at_least_32_chars_xxxxxxx
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Unit + security tests
        run: pnpm test
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ci_placeholder_secret_at_least_32_characters_long_xxxxx
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://dashbi:changeme@localhost:5432/dashbi
          DATABASE_READONLY_URL: postgresql://dashbi_readonly:changeme@localhost:5432/dashbi
          REDIS_URL: redis://localhost:6379
          LLM_KEY_ENCRYPTION_KEY: ci_placeholder_encryption_key_at_least_32_chars_xxxxxxx
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Build (catches route collisions, RSC/server-only leaks, Suspense boundary issues)
        run: pnpm build
        env:
          NODE_ENV: production
          BETTER_AUTH_SECRET: ci_placeholder_secret_at_least_32_characters_long_xxxxx
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://dashbi:changeme@localhost:5432/dashbi
          DATABASE_READONLY_URL: postgresql://dashbi_readonly:changeme@localhost:5432/dashbi
          REDIS_URL: redis://localhost:6379
          LLM_KEY_ENCRYPTION_KEY: ci_placeholder_encryption_key_at_least_32_chars_xxxxxxx
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    # E2E is currently non-blocking. The verify job (lint + typecheck
    # + test + build) is the merge gate. E2E has deeper setup needs
    # (DB roles, seed data, real auth sessions) that we're working
    # through in a separate sprint. Until then, e2e failures show as
    # red on the run but don't block the workflow status.
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashbi
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: dashbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generate CI-only placeholder secrets at runtime. Never hardcode
      # anything that looks like a real secret in this YAML — secret
      # scanners would flag it. These values are scoped to this job and
      # discarded at teardown.
      - name: Generate CI placeholder secrets
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "LLM_KEY_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "PDF_WORKER_SECRET=$(openssl rand -hex 16)"
            echo "DATABASE_URL=postgresql://dashbi:changeme@localhost:5432/dashbi"
            echo "DATABASE_READONLY_URL=postgresql://dashbi_readonly:changeme@localhost:5432/dashbi"
            echo "REDIS_URL=redis://localhost:6379"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      # Migrations reference the dashbi_readonly role (GRANT statements
      # in 0002_nlqa.sql), so the role must exist before db:migrate runs.
      # The local init-readonly.sql creates it NOLOGIN; we need LOGIN for
      # DATABASE_READONLY_URL. Set the password and grant privileges in
      # one shot.
      - name: Provision dashbi_readonly role
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U dashbi -d dashbi -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dashbi_readonly') THEN
              CREATE ROLE dashbi_readonly LOGIN PASSWORD 'changeme';
            ELSE
              ALTER ROLE dashbi_readonly WITH LOGIN PASSWORD 'changeme';
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO dashbi_readonly;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO dashbi_readonly;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO dashbi_readonly;
          SQL

      - run: pnpm db:migrate

      - run: pnpm playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
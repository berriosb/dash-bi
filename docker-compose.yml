name: dashbi

# dash-bi production compose (single-node staging/prod).
#
# This file is the canonical production topology. It uses Compose's
# `${VAR:?message}` syntax for every secret that the Zod env schema
# (`app/src/lib/env.ts`) or the Postgres/Redis services require. An
# operator who forgets to set one of these in `.env.staging` will see
# docker compose fail fast with the message embedded after `:?`, instead
# of booting the stack with a publicly-known placeholder password.
#
# For local dev, use `app/docker-compose.yml` instead — that file
# intentionally exposes ports for Postgres/Redis and skips the prod
# secret gates.

services:
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile.migrate
    image: dashbi/migrate:${VERSION:-latest}
    # One-shot: applies the schema and exits. `restart: no` is explicit so a
    # failed migration is not retried in a loop that hides the error.
    restart: 'no'
    environment:
      # The one role that owns the schema. Both `drizzle-kit migrate`
      # (DATABASE_MIGRATION_URL) and `scripts/setup-rls.ts` read it; the
      # app's own DATABASE_URL must never point here (HIGH-5).
      - DATABASE_MIGRATION_URL=postgres://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dashbi]

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: dashbi/app:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Rol de la app: NOSUPERUSER NOBYPASSRLS (HIGH-5). Con el superuser
      # de bootstrap, RLS no se aplica y el aislamiento es decorativo.
      - DATABASE_URL=postgres://${POSTGRES_APP_USER:?POSTGRES_APP_USER required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      # Solo para `pnpm db:migrate`: es el owner de las tablas.
      - DATABASE_MIGRATION_URL=postgres://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      - DATABASE_READONLY_URL=postgres://${POSTGRES_READONLY_USER:?POSTGRES_READONLY_USER required}:${POSTGRES_READONLY_PASSWORD:?POSTGRES_READONLY_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required (>=32 chars)}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?BETTER_AUTH_URL required}
      - LLM_KEY_ENCRYPTION_KEY=${LLM_KEY_ENCRYPTION_KEY:?LLM_KEY_ENCRYPTION_KEY required (32 bytes hex)}
      - PDF_WORKER_URL=http://pdf-worker:3001
      - PDF_WORKER_SECRET=${PDF_WORKER_SECRET:?PDF_WORKER_SECRET required (>=16 chars)}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      # Email is optional in dev; if left blank the email provider is
      # instantiated in test/no-op mode. Never use a placeholder value
      # here — Resend will reject requests with `re_xxx_dummy` style
      # strings and the failure mode is silent.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@dash-bi.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The app image is a `standalone` bundle with no drizzle-kit, so the
      # schema cannot be migrated from inside it. `migrate` applies the
      # pending migrations plus the RLS policies and then exits;
      # `service_completed_successfully` is what stops a new build from
      # serving traffic against the previous schema.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks: [dashbi]

  pdf-worker:
    build:
      context: ./app
      dockerfile: Dockerfile.worker
    image: dashbi/pdf-worker:${VERSION:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Solo el renderer. Este proceso abre Chrome sobre contenido del
      # tenant: no tiene (y no debe tener) credenciales de base de datos ni
      # la master key que descifra las BYOK. El runner de jobs va aparte.
      - WORKER_ROLE=pdf
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - INTERNAL_APP_URL=${INTERNAL_APP_URL:-http://app:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EXPORTS_DIR=/var/lib/dash-bi/exports
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - exports:/var/lib/dash-bi/exports
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks: [dashbi]

  jobs-worker:
    build:
      context: ./app
      dockerfile: Dockerfile.worker
    image: dashbi/pdf-worker:${VERSION:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Alertas y reportes programados. Necesitan la base de datos y la
      # master key (descifran la URL de los canales de alerta), pero NO
      # abren Chrome.
      - WORKER_ROLE=jobs
      # Rol de la app: NOSUPERUSER NOBYPASSRLS (HIGH-5). Con el superuser
      # de bootstrap, RLS no se aplica y el aislamiento es decorativo.
      - DATABASE_URL=postgres://${POSTGRES_APP_USER:?POSTGRES_APP_USER required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      - DATABASE_READONLY_URL=postgres://${POSTGRES_READONLY_USER:?POSTGRES_READONLY_USER required}:${POSTGRES_READONLY_PASSWORD:?POSTGRES_READONLY_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      # SIN `DATABASE_MIGRATION_URL`: esa es la credencial de OWNER de las
      # tablas y solo la usan las migraciones (`pnpm db:migrate`).
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - LLM_KEY_ENCRYPTION_KEY=${LLM_KEY_ENCRYPTION_KEY:?LLM_KEY_ENCRYPTION_KEY required (32 bytes hex)}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@dash-bi.com}
      # El runner encola los PDF: necesita la URL de la app para armar el
      # link de impresión.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks: [dashbi]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dashbi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_READONLY_USER=${POSTGRES_READONLY_USER:-dashbi_readonly}
      - POSTGRES_READONLY_PASSWORD=${POSTGRES_READONLY_PASSWORD:?POSTGRES_READONLY_PASSWORD required}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER:?POSTGRES_APP_USER required}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:-dashbi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres/init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=200
        -c statement_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashbi} -d ${POSTGRES_DB:-dashbi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks: [dashbi]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis-data:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 600M
    networks: [dashbi]

volumes:
  pgdata:
  exports:
  redis-data:

networks:
  dashbi:
    driver: bridge